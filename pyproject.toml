[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "market-intelligence-core"
version = "0.1.0"
description = "Auditable crypto market intelligence and validation engine"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0,<4",
    "pandas-ta-classic==0.9.0",
]

[project.optional-dependencies]
candlestick = ["TA-Lib>=0.6.0"]

[tool.setuptools.packages.find]
include = ["mi_core*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
