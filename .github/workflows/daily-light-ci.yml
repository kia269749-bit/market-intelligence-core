name: Daily Lightweight Research CI

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/daily-light-ci.yml"
      - "mi_core/**"
      - "tests/**"
      - "tools/**"

permissions:
  contents: read

concurrency:
  group: daily-light-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Dependency-free unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
