name: EMA20-50 Independent Candidate Validation

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "tools/ema_candidate_validation.py"
      - "tests/test_ema_candidate_validation.py"
      - ".github/workflows/ema-candidate-validation.yml"
      - "mi_core/real_data.py"
      - "mi_core/storage.py"

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run candidate validation regression tests
        run: python -m unittest discover -s tests -p 'test_ema_candidate_validation.py' -v

  multi-window-real-data:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        symbol: [BTCUSDT, ETHUSDT, BNBUSDT, SOLUSDT, XRPUSDT]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download public daily OHLC data
        run: |
          mkdir -p data/real reports/ema-candidate
          python -m mi_core.cli real --symbol ${{ matrix.symbol }} --interval 1d --bars 2500 --out data/real/${{ matrix.symbol }}_1d.jsonl --report reports/ema-candidate/${{ matrix.symbol }}_data.json
      - name: Validate fixed candidate across annual windows at fixed project cost
        run: |
          python tools/ema_candidate_validation.py \
            --input data/real/${{ matrix.symbol }}_1d.jsonl \
            --out reports/ema-candidate/${{ matrix.symbol }}_multi_window.json \
            --symbol ${{ matrix.symbol }} --costs 0.24 --capital 500
      - name: Publish reproducible research report
        uses: actions/upload-artifact@v4
        with:
          name: ema-candidate-validation-${{ matrix.symbol }}
          path: |
            data/real/${{ matrix.symbol }}_1d.jsonl
            reports/ema-candidate/${{ matrix.symbol }}_data.json
            reports/ema-candidate/${{ matrix.symbol }}_multi_window.json
          if-no-files-found: error
