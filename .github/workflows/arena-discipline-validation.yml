name: Arena discipline validation

on:
  pull_request:
    paths:
      - "mi_core/**"
      - "tools/arena_discipline_backtest.py"
      - "tests/test_arena_discipline_backtest.py"
  push:
    branches:
      - "research/brain-arena-evidence"

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test runner
        run: python -m pip install pytest
      - name: Run focused tests
        run: python -m pytest -q tests/test_arena_discipline_backtest.py tests/test_arena_evidence.py tests/test_walk_forward_discipline.py
