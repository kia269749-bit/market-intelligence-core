name: Real Multi-Asset OOS Research

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/real-multi-asset-oos.yml"
      - "mi_core/real_validation.py"
      - "mi_core/cost_policy.py"
      - "mi_core/multi_asset_forecast.py"
      - "mi_core/validated_forecast.py"
      - "mi_core/economic_edge.py"
      - "mi_core/trade_economics.py"
      - "mi_core/adaptive_selector.py"
      - "mi_core/binance_futures_data.py"
      - "mi_core/hyperliquid_data.py"
      - "mi_core/path_forecast.py"
      - "mi_core/real_data.py"
      - "mi_core/cli.py"
      - "tools/economic_path_validation.py"
      - "tools/real_opportunity_scan.py"
      - "tests/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {symbol: BTCUSDT, coin: BTC}
          - {symbol: ETHUSDT, coin: ETH}
          - {symbol: SOLUSDT, coin: SOL}
          - {symbol: BNBUSDT, coin: BNB}
          - {symbol: XRPUSDT, coin: XRP}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Download Hyperliquid perpetual Project60 data
        run: |
          mkdir -p data/real reports
          python -m mi_core.hyperliquid_data --coin ${{ matrix.coin }} --asset-key ${{ matrix.symbol }} --interval 1h --bars 8000 --out data/real/${{ matrix.symbol }}_hyperliquid_project60.jsonl > reports/${{ matrix.symbol }}_hyperliquid_coverage.json
      - name: Evaluate adaptive strategy tournament with central costs
        env:
          SYMBOL: ${{ matrix.symbol }}
        run: |
          for mode in base strict; do
            COST_MODE="$mode" python - <<'PY'
          import json, os
          from pathlib import Path
          from mi_core.multi_asset_forecast import load_project60_assets
          from mi_core.adaptive_selector import evaluate_adaptive_selection
          symbol = os.environ["SYMBOL"]
          mode = os.environ["COST_MODE"]
          source = Path(f"data/real/{symbol}_hyperliquid_project60.jsonl")
          series = load_project60_assets(source, max_rows=8000)
          bars = series[symbol]
          result = evaluate_adaptive_selection(
              bars, horizon=60, cost_mode=mode, train_window=1500,
              min_train_trades=20, min_oos_trades=12)
          out = Path(f"reports/{symbol}_adaptive_selector_{mode}.json")
          out.write_text(json.dumps(result, indent=2, sort_keys=True))
          print(json.dumps({
              "symbol": symbol, "cost_mode": mode,
              "round_trip_cost_pct": result.get("cost_pct"),
              "selected_strategy": result.get("selected_strategy"),
              "training_gate": result.get("training_gate"),
              "oos_trades": (result.get("walk_forward_oos") or {}).get("trades"),
              "oos_net_profit_pct": (result.get("walk_forward_oos") or {}).get("net_profit_pct"),
              "oos_expectancy_pct": (result.get("walk_forward_oos") or {}).get("mean_net_pct"),
              "oos_profit_factor": (result.get("walk_forward_oos") or {}).get("profit_factor"),
              "accepted": result.get("accepted"), "status": result.get("status"),
              "reasons": result.get("reasons"),
          }, sort_keys=True))
          PY
          done
      - name: Publish validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: market-intelligence-${{ matrix.symbol }}-oos
          path: |
            data/real/${{ matrix.symbol }}_hyperliquid_project60.jsonl
            reports/${{ matrix.symbol }}_hyperliquid_coverage.json
            reports/${{ matrix.symbol }}_adaptive_selector_base.json
            reports/${{ matrix.symbol }}_adaptive_selector_strict.json

# research matrix trigger
# validation trigger: real multi-asset OOS run


  v4-cross-asset-wfa:
    name: Cross-asset v4 WFA with Holm-adjusted baselines
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download all futures Project60 artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: market-intelligence-*-oos
          path: artifacts
          merge-multiple: true
      - name: Merge assets by timestamp
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          merged = {}
          files = sorted(Path("artifacts/data/real").glob("*_hyperliquid_project60.jsonl"))
          if len(files) != 5:
              raise SystemExit(f"expected 5 futures files, found {len(files)}")
          for path in files:
              for line in path.read_text().splitlines():
                  if not line.strip():
                      continue
                  row = json.loads(line)
                  ts = int(row["timestamp"])
                  target = merged.setdefault(ts, {"timestamp": ts, "coins": {}})
                  target["coins"].update(row.get("coins") or {})
          out = Path("data/real/project60_multi_asset.jsonl")
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text("".join(json.dumps(merged[k], separators=(",", ":")) + "\n" for k in sorted(merged)))
          print(json.dumps({"source_files": [str(x) for x in files], "timestamps": len(merged), "output": str(out)}))
          PY
      - name: Run cross-asset WFA at base and strict costs
        run: |
          mkdir -p reports
          python -m mi_core.real_validation --input data/real/project60_multi_asset.jsonl --top 5 --max-rows 8000 --horizon 60 --min-samples 100 --cost-mode base --out reports/project60_v4_base.json
          python -m mi_core.real_validation --input data/real/project60_multi_asset.jsonl --top 5 --max-rows 8000 --horizon 60 --min-samples 100 --cost-mode strict --out reports/project60_v4_strict.json
      - name: Print model versus Buy & Hold and Random
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for mode in ("base", "strict"):
              report = json.loads(Path(f"reports/project60_v4_{mode}.json").read_text())
              print(json.dumps({
                  "mode": mode,
                  "policy": report.get("policy"),
                  "aggregate": report.get("aggregate"),
                  "assets": [{
                      "symbol": asset.get("asset"),
                      "independent_trades": ((asset.get("baseline_metrics") or {}).get("model") or {}).get("directional_predictions"),
                      "model_net_usd": ((asset.get("baseline_metrics") or {}).get("model") or {}).get("net_profit_usd"),
                      "model_pf": ((asset.get("baseline_metrics") or {}).get("model") or {}).get("profit_factor"),
                      "buy_hold_net_usd": ((asset.get("baseline_metrics") or {}).get("buy_and_hold_long") or {}).get("net_profit_usd"),
                      "random_mean_net_usd": ((asset.get("baseline_metrics") or {}).get("random_direction") or {}).get("mean_net_profit_usd"),
                      "random_p_holm": ((asset.get("baseline_metrics") or {}).get("random_direction") or {}).get("holm_adjusted_p_value"),
                      "baseline_gate": asset.get("baseline_gate"),
                      "accepted": (asset.get("acceptance_gate") or {}).get("accepted"),
                      "tier": asset.get("opportunity_tier")
                  } for asset in report.get("assets", [])]
              }, sort_keys=True))
          PY
      - name: Publish cross-asset v4 WFA artifacts
        uses: actions/upload-artifact@v4
        with:
          name: project60-v4-cross-asset-wfa
          path: |
            data/real/project60_multi_asset.jsonl
            reports/project60_v4_base.json
            reports/project60_v4_strict.json
