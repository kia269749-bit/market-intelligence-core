name: Real Market Research

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  real-research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Download and analyze real BTCUSDT data
        run: |
          python -m mi_core.cli real             --symbol BTCUSDT             --interval 1h             --bars 5000             --out data/real/btcusdt_1h.jsonl             --report reports/real_btcusdt_1h.json
      - name: Print research configuration
        run: |
          echo "real_research=true"
          echo "symbol=BTCUSDT"
          echo "interval=1h"
          echo "bars=5000"
          echo "oos_horizon=60"
          echo "oos_train_window=300"
          echo "oos_fit_every=10"
          echo "round_trip_cost_pct=0.35"
          echo "capital_usd=500"
          echo "research_only=true"
          echo "live_orders=false"
      - name: Run real OOS economic validation
        run: |
          python -m mi_core.cli forecast-validate             --input data/real/btcusdt_1h.jsonl             --horizon 60             --train-window 300             --out reports/real_btcusdt_1h_forecast_validation.json
      - name: Print OOS economic summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("reports/real_btcusdt_1h_forecast_validation.json")
          x=json.loads(p.read_text())
          print(json.dumps({
              "metadata": x.get("metadata", {}),
              "available": x.get("available"),
              "resolved": x.get("resolved"),
              "accuracy": x.get("accuracy"),
              "metrics": x.get("metrics", {}),
              "capital_metrics": x.get("capital_metrics", {}),
              "acceptance_gate": x.get("acceptance_gate", {}),
              "economic_edge": x.get("economic_edge", {}),
              "tier": x.get("tier"),
              "research_only": x.get("research_only"),
              "live_orders": x.get("live_orders")
          }, indent=2, sort_keys=True))
          PY
      - name: Build dashboard
        run: |
          python -m mi_core.cli dashboard             --report reports/real_btcusdt_1h.json             --out reports/real_btcusdt_1h.html
      - name: Publish research artifact
        uses: actions/upload-artifact@v4
        with:
          name: market-intelligence-real-btcusdt-1h
          path: |
            reports/real_btcusdt_1h.json
            reports/real_btcusdt_1h.html
            reports/real_btcusdt_1h_forecast_validation.json
            data/real/btcusdt_1h.jsonl
