name: Market Intelligence CI
on:
  push:
    branches: [main, "feat/**", "integration/**"]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m unittest discover -s tests -v
      - run: python -m mi_core.cli demo --out /tmp/mi-demo
      - run: python -m mi_core.cli analyze --input /tmp/mi-demo/market.jsonl
