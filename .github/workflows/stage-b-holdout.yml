name: Stage B Locked Holdout
on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/locked-crypto-holdout-stage-b]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  locked-holdout-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verify lock SHA-256
        run: sha256sum --check config/final_holdout_lock.sha256
      - name: Run holdout isolation tests
        run: python -m unittest tests.test_locked_holdout -v
