name: OHLC Execution Validation

on:
  push:
    branches: [main, 'feat/**']
    paths:
      - "mi_core/models.py"
      - "mi_core/real_data.py"
      - "tools/ohlc_execution_backtest.py"
      - "tests/**"
      - ".github/workflows/ohlc-execution-validation.yml"
  pull_request:
    branches: [main]
    paths:
      - "mi_core/models.py"
      - "mi_core/real_data.py"
      - "tools/ohlc_execution_backtest.py"
      - "tests/**"
      - ".github/workflows/ohlc-execution-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Unit tests
        run: python -m unittest discover -s tests -v

  real-data-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        symbol: [BTCUSDT, ETHUSDT, SOLUSDT, BNBUSDT, XRPUSDT]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download real 5-minute OHLC bars
        run: |
          mkdir -p data/real reports
          python -m mi_core.cli real --symbol ${{ matrix.symbol }} --interval 5m --bars 5000 --out data/real/${{ matrix.symbol }}_5m.jsonl --report reports/${{ matrix.symbol }}_5m.json
      - name: Run execution-aware walk-forward backtest
        run: |
          python tools/ohlc_execution_backtest.py --input data/real/${{ matrix.symbol }}_5m.jsonl --out reports/${{ matrix.symbol }}_execution_backtest.json --horizon-bars 96 --step-bars 48 --max-evals 60 --min-history 300 --cost-pct 0.35 --capital 500
      - name: Print compact metrics
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("reports/${{ matrix.symbol }}_execution_backtest.json")
          x=json.loads(p.read_text())
          print(json.dumps({
            "symbol": x.get("symbol"),
            "bars": x.get("bars"),
            "evaluation_points": x.get("evaluation_points"),
            "trade_ready": x.get("trade_ready"),
            "research_only": x.get("research_only"),
            "results": [{
              "target_pct": r["target_pct"],
              "stop_pct": r["stop_pct"],
              "cohort": r["cohort"],
              "development": r["development"],
              "holdout_oos": r["holdout_oos"],
              "full_walk_forward": r["full_walk_forward"]
            } for r in x.get("results", [])]
          }, sort_keys=True))
          PY
      - name: Publish report
        uses: actions/upload-artifact@v4
        with:
          name: ohlc-execution-${{ matrix.symbol }}
          path: |
            data/real/${{ matrix.symbol }}_5m.jsonl
            reports/${{ matrix.symbol }}_execution_backtest.json
