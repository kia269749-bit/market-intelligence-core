name: Daily Multi-Year Data Coverage Audit

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/daily-multiyear-coverage.yml"
      - "tools/daily_multiyear_coverage.py"
      - "tests/test_daily_multiyear_coverage.py"
      - "mi_core/real_data.py"

permissions:
  contents: read

jobs:
  daily-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Download and audit up to 2200 daily candles for 30 currently listed symbols
        run: |
          mkdir -p data/daily_multiyear reports
          python tools/daily_multiyear_coverage.py \
            --out-dir data/daily_multiyear \
            --report reports/daily_multiyear_coverage.json \
            --bars 2200
      - name: Publish raw data and coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-multiyear-coverage
          path: |
            data/daily_multiyear/*.jsonl
            reports/daily_multiyear_coverage.json
          if-no-files-found: warn
          retention-days: 30
