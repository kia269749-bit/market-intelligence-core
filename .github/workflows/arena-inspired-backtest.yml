name: Arena-Inspired Crypto Backtest

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Run arena-inspired crypto backtest
        run: python tools/arena_inspired_backtest.py BTCUSDT ETHUSDT SOLUSDT BNBUSDT XRPUSDT
      - name: Upload research report
        uses: actions/upload-artifact@v4
        with:
          name: arena-inspired-crypto-backtest
          path: reports/arena_inspired_backtest.json
