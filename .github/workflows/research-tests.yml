name: Research strategy tests

on:
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-research-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run strategy and TP diagnostic tests
        run: |
          python -m unittest discover -s tests -p 'test_strategy_ensemble.py' -v
          python -m unittest discover -s tests -p 'test_tp_path_validation.py' -v
          python -m unittest discover -s tests -p 'test_tp_execution_backtest.py' -v
