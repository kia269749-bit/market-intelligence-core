name: Research strategy tests

on:
  push:
    branches:
      - feat/economic-edge-diagnostic
      - "fix/**"
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-research-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run focused research tests
        run: |
          set -e
          python -m pip install pytest
          python -m pytest -q \
            tests/test_cost_policy.py \
            tests/test_costs.py \
            tests/test_trade_economics.py \
            tests/test_economic_edge.py \
            tests/test_validated_forecast_lightweight.py \
            tests/test_oos_multihorizon.py
