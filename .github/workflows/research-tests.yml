name: Research strategy tests

on:
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-research-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest for function-style backtest tests
        run: python -m pip install pytest
      - name: Run backtest and centralized cost/source tests
        run: |
          python -m pytest tests/test_backtest.py -q
          python -m unittest discover -s tests -p 'test_costs.py' -v
          python -m unittest discover -s tests -p 'test_trade_economics.py' -v
          python -m unittest discover -s tests -p 'test_central_config.py' -v
          python -m unittest discover -s tests -p 'test_lbank_futures.py' -v
