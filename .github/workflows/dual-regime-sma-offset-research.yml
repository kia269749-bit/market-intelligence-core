name: Dual Regime SMA Offset Exploratory WFA

on:
  workflow_dispatch:
    inputs:
      as_of:
        description: "Frozen UTC cutoff (ISO-8601)"
        required: true
        default: "2026-10-29T00:00:00Z"
  push:
    branches: ["audit/**"]
    paths:
      - "tools/dual_regime_sma_offset.py"
      - "tools/validate_protocol_lock.py"
      - "tools/evaluate_acceptance.py"
      - "tests/test_dual_regime_sma_offset.py"
      - "research/protocol_lock.json"
      - "research/experiments/dual_regime_sma_offset_protocol.md"
      - ".github/workflows/dual-regime-sma-offset-research.yml"
      - "mi_core/real_data.py"
      - "mi_core/storage.py"
      - "mi_core/costs.py"
  pull_request:
    branches: [main, 'fix/**', 'audit/**']
    paths:
      - "tools/dual_regime_sma_offset.py"
      - "tools/validate_protocol_lock.py"
      - "tools/evaluate_acceptance.py"
      - "tests/test_dual_regime_sma_offset.py"
      - "research/protocol_lock.json"
      - "research/experiments/dual_regime_sma_offset_protocol.md"
      - ".github/workflows/dual-regime-sma-offset-research.yml"
      - "mi_core/real_data.py"
      - "mi_core/storage.py"
      - "mi_core/costs.py"

env:
  AS_OF_UTC: ${{ github.event.inputs.as_of || '2026-10-29T00:00:00Z' }}

concurrency:
  group: dual-regime-sma-offset-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate locked project protocol
        run: python tools/validate_protocol_lock.py
      - name: Run focused simulator tests
        run: python -m unittest discover -s tests -p 'test_dual_regime_sma_offset.py' -v

  exploratory-wfa:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download fixed 20-asset 4-hour Binance Spot proxy universe
        run: |
          mkdir -p data/dual-regime reports/dual-regime
          python - <<'PY'
          import json
          import os
          from datetime import datetime
          from pathlib import Path
          from mi_core.real_data import download
          as_of_utc = os.environ["AS_OF_UTC"]
          as_of_ms = int(datetime.fromisoformat(as_of_utc.replace("Z", "+00:00")).timestamp() * 1000)
          symbols = "BTCUSDT ETHUSDT BNBUSDT SOLUSDT XRPUSDT ADAUSDT DOGEUSDT TRXUSDT LINKUSDT AVAXUSDT DOTUSDT LTCUSDT BCHUSDT UNIUSDT NEARUSDT APTUSDT ARBUSDT OPUSDT SUIUSDT FILUSDT".split()
          for symbol in symbols:
              out = Path("data/dual-regime") / f"{symbol}_4h.jsonl"
              bars, path = download(symbol=symbol, interval="4h", bars=12000, out=str(out), end_ms=as_of_ms)
              meta = {"symbol": symbol, "venue": "Binance Spot public OHLCV proxy", "interval": "4h",
                      "bars": len(bars), "as_of_utc": as_of_utc, "first_ts": bars[0].ts if bars else None,
                      "last_ts": bars[-1].ts if bars else None, "research_only": True, "live_orders": False}
              (Path("reports/dual-regime") / f"{symbol}_data.json").write_text(json.dumps(meta, indent=2))
              print(json.dumps(meta, sort_keys=True))
          PY
      - name: Run primary preregistered cost scenario
        run: |
          python tools/dual_regime_sma_offset.py --data-dir data/dual-regime --out reports/dual-regime/wfa_cost_0.15.json --costs 0.15 --as-of "$AS_OF_UTC"
      - name: Run mandatory strict-stress cost scenario
        run: python tools/dual_regime_sma_offset.py --data-dir data/dual-regime --out reports/dual-regime/wfa_cost_0.45.json --costs 0.45 --as-of "$AS_OF_UTC"
      - name: Run diagnostic-only cost sensitivities
        run: |
          python tools/dual_regime_sma_offset.py --data-dir data/dual-regime --out reports/dual-regime/wfa_cost_0.12.json --costs 0.12 --as-of "$AS_OF_UTC"
          python tools/dual_regime_sma_offset.py --data-dir data/dual-regime --out reports/dual-regime/wfa_cost_0.04.json --costs 0.04 --as-of "$AS_OF_UTC"
      - name: Evaluate base-cost acceptance gate
        if: always() && hashFiles('reports/dual-regime/wfa_cost_0.15.json') != ''
        run: python tools/evaluate_acceptance.py --report reports/dual-regime/wfa_cost_0.15.json --expected-cost 0.15 --out reports/dual-regime/acceptance_base_0.15.json
      - name: Evaluate strict-stress acceptance gate
        if: always() && hashFiles('reports/dual-regime/wfa_cost_0.45.json') != ''
        run: python tools/evaluate_acceptance.py --report reports/dual-regime/wfa_cost_0.45.json --expected-cost 0.45 --out reports/dual-regime/acceptance_stress_0.45.json
      - name: Publish data, metadata and research reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dual-regime-sma-offset-exploratory-wfa
          path: |
            data/dual-regime/*.jsonl
            reports/dual-regime/*.json
          if-no-files-found: error
