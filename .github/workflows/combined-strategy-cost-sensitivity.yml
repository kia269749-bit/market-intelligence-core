name: Combined Strategy Cost Sensitivity

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/combined-strategy-cost-sensitivity.yml"
      - "tools/ensemble_strategy_tournament.py"
      - "tools/external_strategy_tournament.py"
      - "tools/regime_strategy_analysis.py"
      - "tests/test_ensemble_strategy_tournament.py"

permissions:
  contents: read

jobs:
  combined-oos:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        symbol: [BTCUSDT, ETHUSDT, SOLUSDT, BNBUSDT, XRPUSDT]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run regression tests
        run: |
          python -m unittest discover -s tests -p 'test_ensemble_strategy_tournament.py' -v
          python -m unittest discover -s tests -p 'test_external_strategy_tournament.py' -v
          python -m unittest discover -s tests -p 'test_regime_strategy_analysis.py' -v
      - name: Download daily OHLC
        run: |
          mkdir -p data/real reports/combined-strategy
          python -m mi_core.cli real --symbol ${{ matrix.symbol }} --interval 1d --bars 2500 --out data/real/${{ matrix.symbol }}_1d.jsonl --report reports/combined-strategy/${{ matrix.symbol }}_data.json
      - name: Compare combined strategies at realistic costs
        run: |
          python tools/ensemble_strategy_tournament.py --input data/real/${{ matrix.symbol }}_1d.jsonl --out reports/combined-strategy/${{ matrix.symbol }}_cost_matrix.json --capital 500 --costs 0.20,0.25,0.35
      - uses: actions/upload-artifact@v4
        with:
          name: combined-strategy-cost-${{ matrix.symbol }}
          path: reports/combined-strategy/${{ matrix.symbol }}_*.json
          if-no-files-found: error
