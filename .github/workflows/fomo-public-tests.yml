name: FOMO public decoder tests

on:
  push:
    branches: [feat/fomo-multisource-public-collector, fix/fomo-syntax-imports-20261009]
  pull_request:
    branches: [main, feat/fomo-multisource-public-collector]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m unittest tests.test_fomo_public_sources tests.test_fomo_solana_decoder tests.test_fomo_solana_protocols tests.test_fomo_solana_trade_adapter -v
