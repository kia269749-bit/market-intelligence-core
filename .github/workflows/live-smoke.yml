name: Live Market Smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: One read-only LBank futures snapshot
        run: |
          python -c 'from mi_core.lbank_futures import fetch_snapshot; s = fetch_snapshot(); q = s["data_quality"]; print("exchange=lbank market=futures quality={} symbols={}/{}".format(q["status"], q["successful_sources"], q["expected_sources"])); print("symbols=" + ",".join(r["symbol"] for r in s["rows"])); assert s["exchange"] == "lbank" and s["market"] == "futures"; assert q["status"] == "HEALTHY"; assert s["research_only"] is True and s["live_orders"] is False'
